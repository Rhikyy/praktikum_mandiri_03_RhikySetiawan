<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Layout</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #0f172a;
        padding: 10px;
        color: #f8fafc;
      }

      .wrapper {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        gap: 10px;
      }

      header {
        background-color: #1e293b; 
        color: #f8fafc;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: bold;
        border: 1px solid #334155;
        border-radius: 8px;
      }

      nav {
        background-color: #3b82f6; 
        color: #ffffff;
        padding: 15px;
        text-align: left;
        font-weight: bold;
        border: 1px solid #2563eb;
        border-radius: 8px;
      }

      .main-content {
        display: flex;
        gap: 10px;
        flex: 1;
      }

      article {
        flex: 3;
        background-color: #1e293b; 
        color: #f8fafc;
        padding: 15px;
        border: 1px solid #334155;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      section {
        background-color: #0f172a; 
        color: #cbd5e1;
        padding: 15px;
        border: 1px solid #334155;
        border-radius: 6px;
        flex: 1;
        display: flex;
        align-items: center;
      }

      aside {
        flex: 1;
        background-color: #10b981; 
        padding: 15px;
        border: 1px solid #059669;
        color: #ffffff;
        font-weight: bold;
        border-radius: 8px;
      }

      footer {
        background-color: #1e293b; 
        color: #94a3b8;
        padding: 20px;
        text-align: left;
        font-weight: bold;
        border: 1px solid #334155;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <img src="logo/download.jpeg" alt="" width="100px" />
        <p>My Website</p>
      </header>

      <!-- navbar -->
      <nav>nav</nav>

      <!-- sidebar & content -->
      <div class="main-content">
        <article>
          article
          <section>section</section>
          <section>section</section>
          <section>section</section>
        </article>

        <aside>aside</aside>
      </div>

      <!-- footer -->
      <footer>footer</footer>
    </div>
  </body>
</html>
