<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>layout web menggunakan frameset</title>
  </head>

  <frameset rows="100, *, 50" frameborder="1" border="1" framespacing="0">
    <!-- header -->
    <frame src="header.html" name="headerframe" scrolling="no"></frame>

    <!-- sidebar & main content -->
    <frameset cols="25%, 75%">
      <frame src="sidebar.html" name="menuFrame"></frame>
      <frame src="main.html" name="showFrame"></frame>
    </frameset>

    <!-- footer -->
    <frame src="footer.html"></frame>
  </frameset>
</html>
